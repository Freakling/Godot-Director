; Godot Director check settings · project-owned: setup fills it in; edit freely.
; Read by tools/check.gd. Paths are relative to res://.

[scan]
; Folders the check never loads: third-party code, and editor script templates (they don't parse).
skip=["addons", "script_templates"]

[screens]
; Folders holding screen and UI scripts. Screens show state and call system methods. The check
; fails if they roll random numbers or assign to an autoload's variables. Scripts built into
; .tscn files aren't scanned.
dirs=["scripts/ui"]
; Screen scripts whose existing violations are accepted for now. Each one needs an open
; "Decouple:" item in TASKS.md that removes it from this list.
known=[]
; Autoloads that screens may assign to directly (e.g. a Settings autoload changed by its screen).
allow_writes_to=[]
; Extra regular expressions that screen scripts must not contain.
forbidden=[]

[tests]
; Test files are <dir>/**/test_*.gd and start with extends "res://tools/test_case.gd".
; GUT or gdUnit4 suites found there are skipped; run them from tools/check.local.sh.
dir="tests"

[output]
; Parts of Godot output lines that are known to be harmless in this project.
ignore=[]

[warnings]
; After this many consecutive passing runs with the same warning, check.sh emits a note
; so you can decide whether to add a substring to tools/check.ignore.
; recurring_threshold = 5
