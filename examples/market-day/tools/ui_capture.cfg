; Godot Director screen capture settings · project-owned: edit freely.
; Read by tools/ui_capture.gd (bash tools/ui_capture.sh). Lists are JSON arrays, as in check.cfg.

[sizes]
; Window sizes, WxH. The first is the default size.
list=["1920x1080", "2560x1080", "1280x720"]

[capture]
; Randomness is seeded with this before each screen, so captures repeat.
seed=12345
; Frames to wait after a screen's setup before the screenshot.
settle_frames=6
; At most this many elements in an element map.
max_elements=200
; Seconds a screen's setup may take; a setup that doesn't finish fails that screen only.
setup_timeout=60
; Screen ids never captured (for example a splash that only shows on first boot). A scene path,
; or a scene's file name without .tscn, also marks a scene as deliberately not a catalog screen
; (bash tools/ui_capture.sh --missing).
skip=[]

[lint]
; squeezed-text: wrapping text narrower than this many average characters.
min_label_chars=6
; stretched-control: a button taller than this many times its minimum height.
max_button_height_ratio=2.0
; Run the lint inside `bash tools/check.sh` (one more headless Godot run, at the default size) for
; the screens listed in `enforce` ("*" is all), so a layout bug fails the check. New projects start
; with it on; an upgrade writes it off (check_in_check=false, enforce=[]), so an existing game adopts
; it screen by screen. A missing key reads as off. hard-coded-position is a warning and never fails.
check_in_check=true
enforce=["*"]

[verify]
; bash tools/ui_capture.sh <screen> --verify: how far, in percent of the screen per edge, a built
; element may sit from the spec's Where before it is reported.
tolerance_pct=4.0
